<style>
  html.dark { background: white; filter: invert(1) hue-rotate(180deg); }
  html.dark img { filter: invert(1) hue-rotate(180deg); }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.onchange = function () {
      document.documentElement.classList.toggle('dark', checkbox.checked);
    };
    label.append(checkbox, ' Dark mode');
    document.querySelector('.markdown-body').prepend(label);
  });
</script>
