<style>
  html { color-scheme: light; }
  .markdown-body svg.inline-svg { max-width: 100%; height: auto; }
  .theme-toggle { display: block; text-align: left; margin: 0.5rem 0 1rem; }
  html.dark { color-scheme: dark; background: #0d1117; }
  html.dark body, html.dark .markdown-body { background: #0d1117; color: #ffffff; }
  html.dark .markdown-body a { color: #79c0ff; }
  html.dark .markdown-body table tr { background: #0d1117; color: #ffffff; }
  html.dark .markdown-body pre,
  html.dark .markdown-body .highlight { background: #2a2a2a; color: #ffffff; }
  html.dark .markdown-body pre { border: none; }
  html.dark .highlight :where(span) { color: inherit; background: transparent; }
  html.dark .highlight :is(.k, .kd, .kn, .kp, .kr, .kt, .o, .ow) { color: #ff7b72; }
  html.dark .highlight :is(.s, .s1, .s2, .sa, .sb, .sc, .sd, .se, .sh, .si, .sr, .ss) { color: #a5d6ff; }
  html.dark .highlight :is(.m, .mb, .mf, .mh, .mi, .mo, .il, .kc, .no) { color: #79c0ff; }
  html.dark .highlight :is(.nf, .fm, .nc, .nn) { color: #d2a8ff; }
  html.dark .highlight :is(.c, .c1, .cm, .cs, .cp, .cpf) { color: #a0aab6; }
  html.dark .highlight :is(.n, .na, .nb, .ni, .nl, .nt, .nv, .nx, .p, .w) { color: #ffffff; }
  html.dark .markdown-body code { background: #222222; }
  html.dark .markdown-body pre code { background: transparent; color: #ffffff; }
  html.dark .markdown-body img { background: #0d1117; }
</style>
<script>
  (function () {
    const root = document.documentElement;
    const key = 'mock-coms4995-dark-mode';
    try { root.classList.toggle('dark', localStorage.getItem(key) === 'true'); } catch (error) {}
    document.addEventListener('DOMContentLoaded', function () {
      const content = document.querySelector('.markdown-body');
      if (!content) return;
      const label = document.createElement('label');
      label.className = 'theme-toggle';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = root.classList.contains('dark');
      checkbox.onchange = function () {
        root.classList.toggle('dark', checkbox.checked);
        try { localStorage.setItem(key, String(checkbox.checked)); } catch (error) {}
      };
      label.append(checkbox, ' Dark mode');
      const heading = content.querySelector(':scope > h1');
      if (heading) heading.after(label);
      else content.prepend(label);

      content.querySelectorAll('img').forEach(async function (image) {
        const url = new URL(image.src, document.baseURI);
        if (url.origin !== location.origin || !url.pathname.toLowerCase().endsWith('.svg')) return;
        try {
          const response = await fetch(url);
          const parsed = new DOMParser().parseFromString(await response.text(), 'image/svg+xml');
          const svg = parsed.documentElement;
          if (parsed.querySelector('parsererror') || svg.localName !== 'svg') throw new Error('Invalid SVG');
          svg.style.colorScheme = 'inherit';
          svg.classList.add('inline-svg');
          svg.setAttribute('role', 'img');
          svg.setAttribute('aria-label', image.alt || 'Diagram');
          image.replaceWith(document.importNode(svg, true));
        } catch (error) {
          // Keep the original image if loading or parsing fails.
        }
      });
    });
  }());
</script>
